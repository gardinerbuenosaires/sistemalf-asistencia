<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>Empleados — Sistema de Fichaje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
  header { background: #F1EFE8; border-bottom: 1px solid #D3D1C7; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  nav a { color: #2C2C2A; font-size: .9rem; text-decoration: none; opacity: .75; }
  nav a:hover { opacity: 1; }
  nav a.activo { opacity: 1; font-weight: bold; }
  .nav-group { position: relative; display: inline-flex; align-items: center; }
  .nav-trigger { color: #2C2C2A; font-size: .9rem; cursor: default; opacity: .75; user-select: none; white-space: nowrap; }
  .nav-group:hover .nav-trigger, .nav-group.activo .nav-trigger { opacity: 1; }
  .nav-group.activo .nav-trigger { font-weight: bold; }
  .nav-dropdown { display: none; position: absolute; top: 100%; left: 0;
    background: white; border: 1px solid #D3D1C7; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1); min-width: 160px; z-index: 200; padding: 4px 0; }
  .nav-group:hover .nav-dropdown { display: block; }
  .nav-dropdown a { display: block; padding: 8px 16px; }
  .nav-dropdown a:hover { background: #f4f6f9; }
  [data-perm] { display: none; }

  main { display: grid; grid-template-columns: 360px 1fr; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; align-items: start; }

  .panel { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .panel-header h2 { font-size: .95rem; }

  /* Lista */
  .buscar { width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid #eee; font-size: .85rem; outline: none; }
  .buscar:focus { background: #fafeff; }
  .emp-list { max-height: calc(100vh - 160px); overflow-y: auto; }
  .emp-item { display: flex; align-items: center; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; gap: 10px; }
  .emp-item:hover { background: #f8f9fa; }
  .emp-item.activo { background: #eef2f5; border-left: 3px solid #2c3e50; }
  .emp-avatar { width: 34px; height: 34px; border-radius: 50%; background: #2c3e50; color: white; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: bold; flex-shrink: 0; }
  .emp-info { flex: 1; min-width: 0; }
  .emp-nombre { font-weight: bold; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .emp-sub { font-size: .75rem; color: #888; margin-top: 1px; }
  .badge-inactivo { font-size: .7rem; background: #f8d7da; color: #721c24; padding: 1px 6px; border-radius: 10px; }

  /* Formulario */
  .form-scroll { padding: 20px; max-height: calc(100vh - 120px); overflow-y: auto; }
  .form-section { margin-bottom: 20px; }
  .form-section-title { font-size: .75rem; font-weight: bold; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid #eee; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .form-grid.cols-1 { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group.span-2 { grid-column: span 2; }
  label { font-size: .78rem; color: #666; font-weight: bold; }
  input[type=text], input[type=date], input[type=email], input[type=tel], select, textarea {
    padding: 7px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: .88rem; font-family: inherit; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #2c3e50; }
  textarea { resize: vertical; min-height: 60px; }

  .form-footer { display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #eee; margin-top: 4px; }
  .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: .88rem; font-weight: bold; }
  .btn-primary { background: #2c3e50; color: white; }
  .btn-primary:hover { background: #3d5166; }
  .btn-secondary { background: #eee; color: #555; }
  .btn-secondary:hover { background: #ddd; }
  .btn-danger { background: #e74c3c; color: white; }
  .btn-sm { padding: 5px 12px; font-size: .8rem; font-weight: normal; }

  .empty-state { padding: 40px 20px; text-align: center; color: #aaa; font-size: .9rem; }

  .cal-vigente { background: #f0faf4; border: 1px solid #b2dfdb; border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cal-nombre { font-weight: bold; font-size: .9rem; color: #1a6b4a; flex: 1; }
  .cal-desde { font-size: .78rem; color: #555; }
  .cal-link { font-size: .78rem; color: #2c3e50; text-decoration: none; border: 1px solid #2c3e50; border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
  .cal-link:hover { background: #2c3e50; color: white; }
  .cal-sin-asignar { font-size: .85rem; color: #888; padding: 8px 0; }
  .cal-sin-asignar a { color: #2c3e50; }
  .cal-historial-label { font-size: .72rem; color: #aaa; margin-top: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .cal-historial-item { font-size: .78rem; color: #777; padding: 2px 0; display: flex; justify-content: space-between; }
  .cal-historial-item span { color: #aaa; }
  .cal-asignar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: #2c3e50; color: white; padding: 10px 18px; border-radius: 7px; display: none; z-index: 200; font-size: .88rem; }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/static/img/logo_horizontal_plano.svg" alt="SistemAlf" style="height:44px"></a>
  <nav style="display:flex;gap:16px;align-items:center">
    <div class="nav-group">
      <span class="nav-trigger">Programación ▾</span>
      <div class="nav-dropdown">
        <a href="/horarios">Horarios</a>
        <a href="/planificacion">Planificación</a>
        <a href="/calendarios">Calendarios</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Registro ▾</span>
      <div class="nav-dropdown">
        <a href="/asistencia">Asistencia</a>
        <a href="/fichajes">Fichajes</a>
        <a href="/asistencia-mensual">Planilla</a>
      </div>
    </div>
    <a href="/empleados" class="activo">Personal</a>
    <a href="/configuracion" data-perm="usuarios:ver">Configuración</a>
    <span id="user-info" style="font-size:.78rem;color:#666;margin-left:8px"></span>
    <a href="#" onclick="logout()">Salir</a>
  </nav>
</header>

<main>
  <!-- Lista -->
  <div class="panel">
    <div class="panel-header">
      <h2>Empleados (<span id="cnt">0</span>)</h2>
      <button class="btn btn-primary btn-sm" data-perm="empleados:editar" onclick="nuevoEmpleado()">+ Nuevo</button>
    </div>
    <input class="buscar" id="buscar" type="text" placeholder="Buscar por nombre, apellido, cargo..." oninput="filtrar()">
    <div class="emp-list" id="emp-list"><div class="empty-state">Cargando...</div></div>
  </div>

  <!-- Formulario -->
  <div class="panel" id="panel-form">
    <div class="panel-header">
      <h2 id="form-titulo">Seleccioná un empleado</h2>
      <div id="form-acciones" style="display:none;gap:8px;display:none">
        <button class="btn btn-danger btn-sm" id="btn-toggle-activo" data-perm="empleados:editar" onclick="toggleActivo()"></button>
        <button class="btn btn-secondary btn-sm" onclick="cancelar()">Cancelar</button>
        <button class="btn btn-primary btn-sm" data-perm="empleados:editar" onclick="guardar()">Guardar</button>
      </div>
    </div>

    <div class="form-scroll" id="form-contenido">
      <div class="empty-state">Seleccioná un empleado de la lista o creá uno nuevo.</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
const DIAS_NOMBRES = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

let todos = [];
let calendarios = [];
let horarios = [];
let editandoId = null;
let editandoActivo = 1;

async function logout() {
  await fetch('/api/auth/logout', {method:'POST'});
  location.href = '/login';
}

let _perms = new Set();
async function _loadPerms() {
  try {
    const me = await fetch('/api/auth/me').then(r => r.json());
    _perms = new Set((me.permisos || []).map(p => `${p.modulo}:${p.accion}`));
    if (me.nombre) document.getElementById('user-info').textContent = me.nombre;
  } catch(e) {}
  document.querySelectorAll('[data-perm]').forEach(el => {
    if (_perms.has(el.dataset.perm)) el.removeAttribute('data-perm');
  });
}
function canDo(m, a) { return _perms.has(`${m}:${a}`); }

function toast(msg, ms = 2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", ms);
}

function iniciales(apellido, nombre) {
  return ((apellido[0] || "") + (nombre[0] || "")).toUpperCase();
}

function filtrar() {
  const q = document.getElementById("buscar").value.toLowerCase();
  const mostrar = q
    ? todos.filter(e => `${e.apellido} ${e.nombre} ${e.cargo||""}`.toLowerCase().includes(q))
    : todos;
  renderLista(mostrar);
}

function renderLista(lista) {
  const cont = document.getElementById("emp-list");
  if (!lista.length) {
    cont.innerHTML = '<div class="empty-state">Sin resultados.</div>';
    return;
  }
  cont.innerHTML = lista.map(e => `
    <div class="emp-item${e.id === editandoId ? " activo" : ""}" id="emp-item-${e.id}" onclick="editarEmpleado(${e.id})">
      <div class="emp-avatar">${iniciales(e.apellido, e.nombre)}</div>
      <div class="emp-info">
        <div class="emp-nombre">${e.apellido}, ${e.nombre}${!e.activo ? ' <span class="badge-inactivo">Inactivo</span>' : ""}</div>
        <div class="emp-sub">${[e.cargo, e.departamento].filter(Boolean).join(" · ") || "Sin cargo"}</div>
      </div>
    </div>`).join("");
}

async function cargar() {
  const res = await fetch("/api/empleados?todos=true");
  todos = await res.json();
  document.getElementById("cnt").textContent = todos.filter(e => e.activo).length;
  filtrar();
}

function buildCalendarioSection(asignaciones = []) {
  const hoy = new Date().toISOString().slice(0, 10);
  const vigente = asignaciones.find(a =>
    a.fecha_desde <= hoy && (a.fecha_hasta === null || a.fecha_hasta >= hoy)
  );
  const historial = asignaciones.filter(a => a !== vigente).slice(0, 3);

  const diasOpts = `<option value="FRANCO">— Franco —</option>` +
    horarios.map(h => `<option value="${h.id}">${h.nombre}</option>`).join("");

  let html = `<div class="form-section">
    <div class="form-section-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>Calendario asignado</span>
      ${canDo('calendarios','editar') ? `<button type="button" class="btn btn-secondary btn-sm" onclick="toggleNuevoCalendario()">+ Crear nuevo</button>` : ''}
    </div>

    <div id="nuevo-cal-panel" style="display:none;background:#f8f9fa;border:1px solid #dee2e6;border-radius:6px;padding:14px;margin-bottom:14px">
      <div class="form-group" style="margin-bottom:10px">
        <label>Nombre del calendario</label>
        <input type="text" id="nuevo-cal-nombre" placeholder="Ej: Mozo — Franco lunes">
      </div>
      <div style="font-size:.75rem;font-weight:bold;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Horario por día</div>
      <div style="display:grid;grid-template-columns:95px 1fr;gap:5px 10px;align-items:center;margin-bottom:12px">
        ${DIAS_NOMBRES.map((d, i) => `
          <span style="font-size:.83rem;font-weight:bold;color:#555">${d}</span>
          <select id="nuevo-dia-${i}" style="padding:5px 8px;border:1px solid #ced4da;border-radius:4px;font-size:.82rem">
            ${diasOpts}
          </select>`).join("")}
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <label style="font-size:.78rem;color:#666;white-space:nowrap">Vigente desde</label>
        <input type="date" id="nuevo-cal-desde" value="${hoy}" style="padding:5px 8px;border:1px solid #ced4da;border-radius:4px;font-size:.82rem;width:140px">
        <button type="button" class="btn btn-primary btn-sm" onclick="crearYAsignarCalendario()">Crear y asignar</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="toggleNuevoCalendario(false)">Cancelar</button>
      </div>
    </div>`;

  if (vigente) {
    html += `<div class="cal-vigente">
      <div class="cal-nombre">${vigente.calendario_nombre}</div>
      <div class="cal-desde">desde ${vigente.fecha_desde}${vigente.fecha_hasta ? " hasta " + vigente.fecha_hasta : ""}</div>
      <a href="/calendarios" class="cal-link">Ver calendarios</a>
      ${canDo('calendarios','editar') ? `<button type="button" class="btn btn-sm" style="background:#e74c3c;color:white;margin-left:auto"
        onclick="quitarCalendario(${vigente.id})">Quitar</button>` : ''}
    </div>`;
  } else {
    html += `<div class="cal-sin-asignar">Sin calendario asignado</div>`;
  }

  if (historial.length) {
    html += `<div class="cal-historial-label">Historial:</div>`;
    html += historial.map(a =>
      `<div class="cal-historial-item">${a.calendario_nombre} <span>${a.fecha_desde} → ${a.fecha_hasta || "activo"}</span></div>`
    ).join("");
  }

  const calOpts = calendarios.map(c =>
    `<option value="${c.id}"${vigente && vigente.calendario_id === c.id ? " selected" : ""}>${c.nombre}</option>`
  ).join("");

  if (canDo('calendarios', 'editar')) {
    html += `<div class="cal-asignar" style="margin-top:10px">
      <select id="asig-cal-id" style="flex:1">
        <option value="">— Asignar calendario existente —</option>
        ${calOpts}
      </select>
      <label style="font-size:.78rem;color:#666;white-space:nowrap">Desde</label>
      <input type="date" id="asig-cal-desde" value="${hoy}" style="width:140px">
      <button class="btn btn-primary btn-sm" onclick="asignarCalendario()">Asignar</button>
    </div>`;
  }

  html += `</div>`;
  return html;
}

function buildForm(e = {}, asignaciones = []) {
  return `
    <form id="emp-form" onsubmit="return false">
      <div class="form-section">
        <div class="form-section-title">Datos personales</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Apellido *</label>
            <input type="text" id="f-apellido" value="${e.apellido||""}" required>
          </div>
          <div class="form-group">
            <label>Nombre *</label>
            <input type="text" id="f-nombre" value="${e.nombre||""}" required>
          </div>
          <div class="form-group">
            <label>DNI</label>
            <input type="text" id="f-dni" value="${e.dni||""}">
          </div>
          <div class="form-group">
            <label>CUIL</label>
            <input type="text" id="f-cuil" value="${e.cuil||""}" placeholder="20-12345678-9">
          </div>
          <div class="form-group">
            <label>Fecha de nacimiento</label>
            <input type="date" id="f-nacimiento" value="${e.fecha_nacimiento||""}">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="f-telefono" value="${e.telefono||""}">
          </div>
          <div class="form-group span-2">
            <label>Email</label>
            <input type="email" id="f-email" value="${e.email||""}">
          </div>
          <div class="form-group span-2">
            <label>Domicilio</label>
            <input type="text" id="f-domicilio" value="${e.domicilio||""}">
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Datos laborales</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Cargo</label>
            <input type="text" id="f-cargo" value="${e.cargo||""}">
          </div>
          <div class="form-group">
            <label>Departamento</label>
            <input type="text" id="f-departamento" value="${e.departamento||""}">
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <input type="text" id="f-categoria" value="${e.categoria||""}">
          </div>
          <div class="form-group">
            <label>Código dispositivo</label>
            <input type="text" id="f-userid" value="${e.user_id||""}" ${e.user_id ? "readonly style='background:#f8f9fa;color:#888'" : ""}>
          </div>
          <div class="form-group">
            <label>Fecha de ingreso</label>
            <input type="date" id="f-ingreso" value="${e.fecha_ingreso||""}">
          </div>
          <div class="form-group">
            <label>Fecha de egreso</label>
            <input type="date" id="f-egreso" value="${e.fecha_egreso||""}">
          </div>
        </div>
      </div>

      ${editandoId ? buildCalendarioSection(asignaciones) : ""}

      <div class="form-section">
        <div class="form-section-title">Observaciones</div>
        <div class="form-grid cols-1">
          <div class="form-group">
            <textarea id="f-obs">${e.observaciones||""}</textarea>
          </div>
        </div>
      </div>

      <div class="form-footer">
        <button class="btn btn-danger btn-sm" id="btn-toggle-activo" onclick="toggleActivo()" style="${!editandoId ? 'display:none' : ''}">
          ${e.activo ? "Dar de baja" : "Reactivar"}
        </button>
        <button class="btn btn-secondary" onclick="cancelar()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardar()">Guardar</button>
      </div>
    </form>`;
}

function nuevoEmpleado() {
  editandoId = null;
  editandoActivo = 1;
  document.getElementById("form-titulo").textContent = "Nuevo empleado";
  document.getElementById("form-contenido").innerHTML = buildForm();
  document.querySelectorAll(".emp-item").forEach(el => el.classList.remove("activo"));
}

async function editarEmpleado(id) {
  const [eRes, aRes] = await Promise.all([
    fetch(`/api/empleados/${id}`),
    fetch(`/api/calendarios/asignaciones/empleado/${id}`)
  ]);
  const e = await eRes.json();
  const asignaciones = await aRes.json();
  editandoId = id;
  editandoActivo = e.activo;
  document.getElementById("form-titulo").textContent = `${e.apellido}, ${e.nombre}`;
  document.getElementById("form-contenido").innerHTML = buildForm(e, asignaciones);
  document.querySelectorAll(".emp-item").forEach(el => el.classList.remove("activo"));
  document.getElementById(`emp-item-${id}`)?.classList.add("activo");
}

function cancelar() {
  editandoId = null;
  document.getElementById("form-titulo").textContent = "Seleccioná un empleado";
  document.getElementById("form-contenido").innerHTML = '<div class="empty-state">Seleccioná un empleado de la lista o creá uno nuevo.</div>';
  document.querySelectorAll(".emp-item").forEach(el => el.classList.remove("activo"));
}

function getFormData() {
  return {
    apellido: document.getElementById("f-apellido").value.trim(),
    nombre: document.getElementById("f-nombre").value.trim(),
    dni: document.getElementById("f-dni").value.trim() || null,
    cuil: document.getElementById("f-cuil").value.trim() || null,
    fecha_nacimiento: document.getElementById("f-nacimiento").value || null,
    fecha_ingreso: document.getElementById("f-ingreso").value || null,
    fecha_egreso: document.getElementById("f-egreso").value || null,
    cargo: document.getElementById("f-cargo").value.trim() || null,
    departamento: document.getElementById("f-departamento").value.trim() || null,
    categoria: document.getElementById("f-categoria").value.trim() || null,
    telefono: document.getElementById("f-telefono").value.trim() || null,
    email: document.getElementById("f-email").value.trim() || null,
    domicilio: document.getElementById("f-domicilio").value.trim() || null,
    observaciones: document.getElementById("f-obs").value.trim() || null,
    activo: editandoActivo,
  };
}

async function guardar() {
  const data = getFormData();
  if (!data.apellido || !data.nombre) { toast("Apellido y nombre son obligatorios"); return; }

  const url = editandoId ? `/api/empleados/${editandoId}` : "/api/empleados";
  const method = editandoId ? "PUT" : "POST";
  const res = await fetch(url, { method, headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });

  if (res.ok) {
    const e = await res.json();
    editandoId = e.id;
    toast(method === "POST" ? "Empleado creado" : "Cambios guardados");
    await cargar();
    document.getElementById(`emp-item-${e.id}`)?.classList.add("activo");
    document.getElementById("form-titulo").textContent = `${e.apellido}, ${e.nombre}`;
  } else {
    const err = await res.json().catch(() => ({}));
    toast("Error: " + (err.detail || "desconocido"));
  }
}

async function toggleActivo() {
  if (!editandoId) return;
  const data = getFormData();
  editandoActivo = editandoActivo ? 0 : 1;
  data.activo = editandoActivo;
  const res = await fetch(`/api/empleados/${editandoId}`, {
    method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(data)
  });
  if (res.ok) {
    toast(editandoActivo ? "Empleado reactivado" : "Empleado dado de baja");
    await cargar();
    await editarEmpleado(editandoId);
  }
}

async function quitarCalendario(asignacionId) {
  if (!confirm("¿Quitar el calendario asignado?\nSe eliminará también la planificación futura auto-generada del empleado.")) return;
  const res = await fetch(`/api/calendarios/asignaciones/${asignacionId}`, { method: "DELETE" });
  if (res.ok) {
    toast("Calendario quitado");
    await editarEmpleado(editandoId);
  } else {
    toast("Error al quitar el calendario");
  }
}

async function asignarCalendario() {
  const calId = parseInt(document.getElementById("asig-cal-id").value);
  const desde = document.getElementById("asig-cal-desde").value;
  if (!calId) { toast("Seleccioná un calendario"); return; }
  if (!desde) { toast("Ingresá la fecha desde"); return; }

  const res = await fetch("/api/calendarios/asignar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ empleado_ids: [editandoId], calendario_id: calId, fecha_desde: desde })
  });
  if (res.ok) {
    toast("Calendario asignado");
    await editarEmpleado(editandoId);
  } else {
    toast("Error al asignar");
  }
}

function toggleNuevoCalendario(forzar) {
  const panel = document.getElementById("nuevo-cal-panel");
  if (!panel) return;
  const mostrar = forzar !== undefined ? forzar : panel.style.display === "none";
  panel.style.display = mostrar ? "block" : "none";
}

async function crearYAsignarCalendario() {
  const nombre = document.getElementById("nuevo-cal-nombre").value.trim();
  if (!nombre) { toast("Ingresá el nombre del calendario"); return; }
  const desde = document.getElementById("nuevo-cal-desde").value;
  if (!desde) { toast("Ingresá la fecha desde"); return; }

  const dias = Array.from({length: 7}, (_, i) => {
    const v = document.getElementById(`nuevo-dia-${i}`).value;
    return {
      dia_semana: i,
      es_franco:  v === "FRANCO",
      horario_id: v !== "FRANCO" ? parseInt(v) : null
    };
  });

  const crRes = await fetch("/api/calendarios", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({nombre, dias})
  });
  if (!crRes.ok) {
    const e = await crRes.json().catch(() => ({}));
    toast("Error al crear: " + (e.detail || "desconocido"));
    return;
  }
  const cal = await crRes.json();

  const asRes = await fetch("/api/calendarios/asignar", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({empleado_ids: [editandoId], calendario_id: cal.id, fecha_desde: desde})
  });

  if (asRes.ok) {
    toast("Calendario creado y asignado");
    // Actualizar lista de calendarios para que aparezca en el selector
    const cRes = await fetch("/api/calendarios");
    calendarios = await cRes.json();
    await editarEmpleado(editandoId);
  } else {
    toast("Calendario creado, error al asignar");
  }
}

async function init() {
  await _loadPerms();
  const [_, cRes, hRes] = await Promise.all([
    cargar(), fetch("/api/calendarios"), fetch("/api/horarios")
  ]);
  calendarios = await cRes.json();
  horarios = await hRes.json();
}

init();
</script>
