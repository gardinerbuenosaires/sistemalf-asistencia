<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>Calendarios — Sistema de Fichaje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
  header { background: #F1EFE8; border-bottom: 1px solid #D3D1C7; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  nav a { color: #2C2C2A; font-size: .9rem; text-decoration: none; opacity: .75; }
  nav a:hover { opacity: 1; }
  nav a.activo { opacity: 1; font-weight: bold; }
  .nav-group { position: relative; display: inline-flex; align-items: center; }
  .nav-trigger { color: #2C2C2A; font-size: .9rem; cursor: default; opacity: .75; user-select: none; white-space: nowrap; }
  .nav-group:hover .nav-trigger, .nav-group.activo .nav-trigger { opacity: 1; }
  .nav-group.activo .nav-trigger { font-weight: bold; }
  .nav-dropdown { display: none; position: absolute; top: 100%; left: 0;
    background: white; border: 1px solid #D3D1C7; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1); min-width: 160px; z-index: 200; padding: 4px 0; }
  .nav-group:hover .nav-dropdown { display: block; }
  .nav-dropdown a { display: block; padding: 8px 16px; }
  .nav-dropdown a:hover { background: #f4f6f9; }
  [data-perm] { display: none !important; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; align-items: start; }
  .section { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .section-header h2 { font-size: 1rem; }

  /* Lista */
  .cal-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; margin-bottom: 6px; background: #f8f9fa; }
  .cal-item:hover { background: #e9ecef; }
  .cal-item.activo { border-color: #2c3e50; background: #eef2f5; }
  .cal-item-info { flex: 1; }
  .cal-item-nombre { font-weight: bold; font-size: .9rem; }
  .cal-item-sub { font-size: .75rem; color: #888; margin-top: 2px; }
  .cal-item-actions { display: flex; gap: 6px; }

  /* Semana preview */
  .semana-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .dia-badge { text-align: center; padding: 3px 2px; border-radius: 4px; font-size: .7rem; }
  .dia-badge .dia-nombre { color: #888; font-size: .65rem; }
  .dia-badge .dia-horario { font-weight: bold; font-size: .7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dia-badge.franco { background: #fff3cd; }
  .dia-badge.simple { background: #d4edda; }
  .dia-badge.cortado { background: #cce5ff; }
  .dia-badge.vacio { background: #f8f9fa; color: #ccc; }

  /* Form */
  .form-group { margin-bottom: 14px; }
  label { font-size: .82rem; color: #666; font-weight: bold; display: block; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: .9rem; }
  input:focus { outline: none; border-color: #2c3e50; }

  .dias-form { display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; align-items: center; margin-top: 8px; }
  .dia-label { font-size: .85rem; font-weight: bold; color: #555; }
  select.dia-select { width: 100%; padding: 6px 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: .85rem; }
  select.dia-select.franco { background: #fff9e6; }
  select.dia-select.simple { background: #f0fbf3; }
  select.dia-select.cortado { background: #f0f7ff; }

  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: .9rem; }
  .btn-primary { background: #2c3e50; color: white; }
  .btn-primary:hover { background: #3d5166; }
  .btn-danger { background: #e74c3c; color: white; font-size: .8rem; padding: 4px 10px; }
  .btn-sm { padding: 4px 10px; font-size: .8rem; }
  .btn-secondary { background: #6c757d; color: white; }

  /* Asignación */
  .asig-section { margin-top: 20px; border-top: 1px solid #eee; padding-top: 16px; }
  .empleado-list { max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; }
  .empleado-chk { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f0f0f0; font-size: .85rem; cursor: pointer; }
  .empleado-chk:hover { background: #f8f9fa; }
  .empleado-chk.ya-asignado { background: #f0faf4; }
  .empleado-chk input { cursor: pointer; }
  .asig-filtro { width: 100%; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: .85rem; margin-bottom: 6px; }
  .asig-acciones { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .asig-acciones input[type=date] { padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: .85rem; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: #2c3e50; color: white; padding: 10px 18px; border-radius: 7px; display: none; z-index: 200; }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/static/img/logo_horizontal_plano.svg" alt="SistemAlf" style="height:44px"></a><span id="nav-brand-empresa" style="display:none;margin-left:12px"></span>
  <nav style="display:flex;gap:16px;align-items:center">
    <div class="nav-group activo">
      <span class="nav-trigger">Programación ▾</span>
      <div class="nav-dropdown">
        <a href="/horarios" data-perm="horarios:ver">Horarios</a>
        <a href="/planificacion" data-perm="planificacion:ver">Planificación</a>
        <a href="/calendarios" class="activo" data-perm="calendarios:ver">Calendarios</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Horarios semanales ▾</span>
      <div class="nav-dropdown">
        <a href="/distribucion" data-perm="distribucion:ver">Cocina</a>
        <a href="/mozos" data-perm="mozos:ver">Mozos Salón</a>
        <a href="/barmans" data-perm="barmans:ver">Barra</a>
        <a href="/peones" data-perm="peones:ver">Peones</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Registro ▾</span>
      <div class="nav-dropdown">
        <a href="/asistencia" data-perm="asistencia:ver">Asistencia</a>
        <a href="/fichajes" data-perm="asistencia:ver">Fichajes</a>
        <a href="/asistencia-mensual" data-perm="asistencia:ver">Planilla</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Personal ▾</span>
      <div class="nav-dropdown">
        <a href="/empleados" data-perm="empleados:ver">Listado</a>
        <a href="/premios" data-perm="premios:ver">Premios</a>
        <a href="/vacaciones" data-perm="vacaciones:ver">Vacaciones</a>
      </div>
    </div>
    <a href="/configuracion" data-perm="usuarios:ver">Configuración</a>
    <a href="/manual-encargado" data-perm="asistencia:ver" target="_blank">Ayuda</a>
    <span id="user-info" style="font-size:.78rem;color:#666;margin-left:8px"></span>
    <a href="#" onclick="logout()">Salir</a>
  </nav>
</header>

<main>
  <!-- Lista de calendarios -->
  <div>
    <div class="section">
      <div class="section-header">
        <h2>Calendarios</h2>
        <button class="btn btn-primary btn-sm" data-perm="calendarios:editar" onclick="nuevoCalendario()">+ Nuevo</button>
      </div>
      <div id="lista-calendarios">Cargando...</div>
    </div>
  </div>

  <!-- Editor + asignación -->
  <div>
    <div class="section" id="panel-editor">
      <div class="section-header">
        <h2 id="editor-titulo">Nuevo calendario</h2>
        <div>
          <button class="btn btn-primary btn-sm" data-perm="calendarios:editar" onclick="guardarCalendario()">Guardar</button>
          <button class="btn btn-sm" style="background:#eee;margin-left:6px" onclick="cancelarEditor()">Cancelar</button>
        </div>
      </div>

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="f-nombre" placeholder="Ej: Mozo cortado - franco jueves">
      </div>

      <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <input type="checkbox" id="f-franco-feriado" style="width:auto;margin:0;cursor:pointer">
        <label for="f-franco-feriado" style="margin:0;cursor:pointer;font-weight:normal;color:#444">
          Franco automático en feriados nacionales
        </label>
      </div>

      <label>Horario por día</label>
      <div class="dias-form" id="dias-form"></div>

      <!-- Asignación a empleados -->
      <div class="asig-section" id="asig-section" style="display:none">
        <h2 style="font-size:.95rem;margin-bottom:12px">Asignar a empleados</h2>
        <input class="asig-filtro" id="asig-filtro" type="text" placeholder="Buscar empleado..." oninput="filtrarEmpleados()">
        <div class="empleado-list" id="empleado-list"></div>
        <div class="asig-acciones">
          <label style="font-size:.82rem">Desde:</label>
          <input type="date" id="asig-desde">
          <button class="btn btn-primary btn-sm" data-perm="calendarios:editar" onclick="asignarEmpleados()">Asignar seleccionados</button>
          <button class="btn btn-sm" style="background:#eee" onclick="desmarcarTodos()">Desmarcar todos</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="/static/js/session.js"></script>
<script src="/static/js/user-menu.js"></script>
<script>
function _localDateStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const DIAS_NOMBRES = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIAS_CORTOS  = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

let horarios = [];
let empleados = [];
let editandoId = null;
let todosEmpleados = [];
let asignadosIds = new Set();

async function logout() {
  await fetch('/api/auth/logout', {method:'POST'});
  location.href = '/login';
}

let _perms = new Set();
async function _loadPerms() {
  try {
    const me = await fetch('/api/auth/me').then(r => r.json());
    _perms = new Set((me.permisos || []).map(p => `${p.modulo}:${p.accion}`));
    if (me.nombre) document.getElementById('user-info').textContent = me.nombre;
  } catch(e) {}
  document.querySelectorAll('[data-perm]').forEach(el => {
    if (_perms.has(el.dataset.perm)) el.removeAttribute('data-perm');
    });
    document.querySelectorAll('.nav-group').forEach(g => {
      const links = g.querySelectorAll('a[href]');
      if (links.length && [...links].every(a => a.hasAttribute('data-perm'))) g.style.display = 'none';
  });
}
function canDo(m, a) { return _perms.has(`${m}:${a}`); }

function toast(msg, ms=2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", ms);
}

function diaBadge(dia) {
  if (!dia || dia.es_franco) return `<div class="dia-badge franco"><div class="dia-nombre">${DIAS_CORTOS[dia?.dia_semana ?? 0]}</div><div class="dia-horario">FRANCO</div></div>`;
  if (!dia.horario_id) return `<div class="dia-badge vacio"><div class="dia-nombre">${DIAS_CORTOS[dia.dia_semana]}</div><div class="dia-horario">—</div></div>`;
  const tipo = dia.horario_tipo || "simple";
  const nombre = (dia.horario_nombre || "?").split(" ")[0];
  return `<div class="dia-badge ${tipo}"><div class="dia-nombre">${DIAS_CORTOS[dia.dia_semana]}</div><div class="dia-horario" title="${dia.horario_nombre}">${nombre}</div></div>`;
}

async function cargarLista() {
  const res = await fetch("/api/calendarios");
  const cals = await res.json();
  const cont = document.getElementById("lista-calendarios");
  if (!cals.length) { cont.innerHTML = '<p style="color:#aaa;font-size:.85rem">Sin calendarios. Creá el primero.</p>'; return; }

  cont.innerHTML = cals.map(c => {
    // Ordenar días
    const dias = Array.from({length:7}, (_,i) => c.dias.find(d=>d.dia_semana===i) || {dia_semana:i, horario_id:null, horario_tipo:null, horario_nombre:null});
    const preview = dias.map(d => diaBadge(d)).join("");
    return `
      <div class="cal-item" id="cal-item-${c.id}" onclick="editarCalendario(${c.id})">
        <div class="cal-item-info">
          <div class="cal-item-nombre">${c.nombre}</div>
          <div class="semana-grid">${preview}</div>
          <div class="cal-item-sub" style="margin-top:4px">
            ${c.empleados_asignados} empleados asignados${c.franco_en_feriado ? ' · <span style="color:#e67e22">&#9670; Franco en feriados</span>' : ''}
          </div>
        </div>
        ${canDo('calendarios','eliminar') ? `<div class="cal-item-actions" onclick="event.stopPropagation()">
          <button class="btn btn-danger" onclick="eliminarCalendario(${c.id},'${c.nombre}')">&#10005;</button>
        </div>` : ''}
      </div>`;
  }).join("");
}

function buildDiasForm(valoresIniciales = {}) {
  // valoresIniciales[i] = {horario_id, es_franco}
  const cont = document.getElementById("dias-form");
  const opts = `<option value="FRANCO">— Franco —</option>` +
    horarios.map(h => `<option value="${h.id}">${h.nombre}</option>`).join("");
  const dis = canDo('calendarios','editar') ? '' : 'disabled';

  cont.innerHTML = DIAS_NOMBRES.map((nombre, i) => `
      <span class="dia-label">${nombre}</span>
      <select class="dia-select" id="dia-${i}" ${dis} onchange="colorSelect(this)">
        ${opts}
      </select>`).join("");

  DIAS_NOMBRES.forEach((_, i) => {
    const sel = document.getElementById(`dia-${i}`);
    const v = valoresIniciales[i];
    if (!v || v.es_franco || !v.horario_id) sel.value = "FRANCO";
    else sel.value = String(v.horario_id);
    colorSelect(sel);
  });
}

function colorSelect(sel) {
  const v = sel.value;
  if (v === "FRANCO") { sel.className = "dia-select franco"; return; }
  sel.style.background = "";
  const h = horarios.find(x => x.id == v);
  sel.className = "dia-select " + (h ? h.tipo : "simple");
}

function nuevoCalendario() {
  editandoId = null;
  document.getElementById("editor-titulo").textContent = "Nuevo calendario";
  document.getElementById("f-nombre").value = "";
  document.getElementById("f-franco-feriado").checked = false;
  buildDiasForm();
  document.getElementById("asig-section").style.display = "none";
  document.querySelectorAll(".cal-item").forEach(el => el.classList.remove("activo"));
}

async function editarCalendario(id) {
  editandoId = id;
  const res = await fetch(`/api/calendarios/${id}`);
  const cal = await res.json();
  const editable = canDo('calendarios','editar');

  document.getElementById("panel-editor").style.display = '';
  document.getElementById("editor-titulo").textContent = cal.nombre;
  document.getElementById("f-nombre").value = cal.nombre;
  document.getElementById("f-nombre").disabled = !editable;
  document.getElementById("f-franco-feriado").checked = !!cal.franco_en_feriado;
  document.getElementById("f-franco-feriado").disabled = !editable;

  const vals = {};
  cal.dias.forEach(d => vals[d.dia_semana] = {horario_id: d.horario_id, es_franco: d.es_franco});
  buildDiasForm(vals);

  // Mostrar asignación con empleados ya asignados marcados
  asignadosIds = new Set(cal.empleados_asignados_ids || []);
  document.getElementById("asig-section").style.display = "block";
  document.getElementById("asig-desde").value = _localDateStr();
  document.getElementById("asig-desde").disabled = !editable;
  renderEmpleados();

  document.querySelectorAll(".cal-item").forEach(el => el.classList.remove("activo"));
  document.getElementById(`cal-item-${id}`)?.classList.add("activo");
}

function cancelarEditor() {
  editandoId = null;
  document.getElementById("f-nombre").value = "";
  document.getElementById("f-franco-feriado").checked = false;
  buildDiasForm();
  document.getElementById("asig-section").style.display = "none";
  document.querySelectorAll(".cal-item").forEach(el => el.classList.remove("activo"));
}

async function guardarCalendario() {
  const nombre = document.getElementById("f-nombre").value.trim();
  if (!nombre) { toast("Ingresá el nombre"); return; }

  const dias = Array.from({length:7}, (_,i) => {
    const v = document.getElementById(`dia-${i}`).value;
    return {
      dia_semana: i,
      es_franco:  v === "FRANCO",
      horario_id: v !== "FRANCO" ? parseInt(v) : null
    };
  });

  const franco_en_feriado = document.getElementById("f-franco-feriado").checked;
  const url = editandoId ? `/api/calendarios/${editandoId}` : "/api/calendarios";
  const method = editandoId ? "PUT" : "POST";

  const res = await fetch(url, {
    method, headers: {"Content-Type":"application/json"},
    body: JSON.stringify({nombre, dias, franco_en_feriado})
  });
  if (res.ok) {
    const cal = await res.json();
    editandoId = cal.id;
    toast(method === "POST" ? "Calendario creado" : "Calendario guardado");
    await cargarLista();
    document.getElementById(`cal-item-${cal.id}`)?.classList.add("activo");
    document.getElementById("asig-section").style.display = "block";
    document.getElementById("asig-desde").value = _localDateStr();
    renderEmpleados();
  } else {
    const err = await res.json();
    toast("Error: " + (err.detail || "desconocido"));
  }
}

async function eliminarCalendario(id, nombre) {
  if (!confirm(`¿Eliminar "${nombre}"?`)) return;
  const res = await fetch(`/api/calendarios/${id}`, {method:"DELETE"});
  if (res.ok) { toast("Eliminado"); cargarLista(); cancelarEditor(); }
  else { const e = await res.json(); toast("Error: " + e.detail); }
}

// ── Asignación ────────────────────────────────────────────────────────────────

function renderEmpleados() {
  const filtro = (document.getElementById("asig-filtro")?.value || "").toLowerCase();
  const lista = document.getElementById("empleado-list");
  const mostrar = filtro
    ? todosEmpleados.filter(e => `${e.apellido} ${e.nombre}`.toLowerCase().includes(filtro))
    : todosEmpleados;
  const editable = canDo('calendarios','editar');
  lista.innerHTML = mostrar.map(e => {
    const asignado = asignadosIds.has(e.id);
    return `<label class="empleado-chk${asignado ? " ya-asignado" : ""}">
      <input type="checkbox" class="chk-emp" value="${e.id}"${asignado ? " checked" : ""}${editable ? "" : " disabled"}>
      <span>${e.apellido}${e.nombre ? ", "+e.nombre : ""} <small style="color:#888">${e.cargo||""}</small></span>
      ${asignado ? '<small style="color:#27ae60;font-weight:bold;margin-left:auto">✓ asignado</small>' : ""}
    </label>`;
  }).join("");
}

function filtrarEmpleados() { renderEmpleados(); }
function desmarcarTodos() { document.querySelectorAll(".chk-emp").forEach(c => c.checked = false); }

async function asignarEmpleados() {
  if (!editandoId) { toast("Guardá el calendario primero"); return; }
  const desde = document.getElementById("asig-desde").value;
  if (!desde) { toast("Seleccioná fecha desde"); return; }
  const ids = [...document.querySelectorAll(".chk-emp:checked")].map(c => parseInt(c.value));
  if (!ids.length) { toast("Seleccioná al menos un empleado"); return; }

  // Confirmación para fechas pasadas
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dDesde = new Date(desde + "T00:00:00");
  if (dDesde < hoy) {
    const dias = Math.round((hoy - dDesde) / 86400000);
    const fmtDesde = dDesde.toLocaleDateString('es-AR');
    const mesDistinto = dDesde.getMonth() !== hoy.getMonth() || dDesde.getFullYear() !== hoy.getFullYear();

    let msg = `La fecha de inicio (${fmtDesde}) es anterior a hoy.\n\n`
      + `Esto va a reescribir la planificación de ${dias} día${dias !== 1 ? 's' : ''} `
      + `y borrar los resultados de asistencia procesados de ese período.\n`
      + `(Los fichajes biométricos no se tocan y se pueden reprocesar.)\n\n`;

    if (mesDistinto) {
      msg += `⚠ ATENCIÓN: la fecha cae en un mes anterior al actual.\n`
           + `Esto afecta días de un período que posiblemente ya fue revisado.\n\n`;
    }

    if (!confirm(msg + '¿Confirmar la asignación?')) return;
  }

  const res = await fetch("/api/calendarios/asignar", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({empleado_ids: ids, calendario_id: editandoId, fecha_desde: desde})
  });
  if (res.ok) {
    const r = await res.json();
    toast(`${r.asignados} empleado${r.asignados !== 1 ? "s" : ""} asignado${r.asignados !== 1 ? "s" : ""}`);
    // Recargar el calendario para actualizar qué empleados están asignados
    const calRes = await fetch(`/api/calendarios/${editandoId}`);
    const cal = await calRes.json();
    asignadosIds = new Set(cal.empleados_asignados_ids || []);
    renderEmpleados();
    await cargarLista();
    document.getElementById(`cal-item-${editandoId}`)?.classList.add("activo");
  } else {
    toast("Error al asignar");
  }
}

async function init() {
  await _loadPerms();
  const [hRes, eRes] = await Promise.all([
    fetch("/api/horarios"),
    fetch("/api/empleados")
  ]);
  horarios = await hRes.json();
  todosEmpleados = await eRes.json();
  if (canDo('calendarios','editar')) {
    buildDiasForm();
  } else {
    document.getElementById('panel-editor').style.display = 'none';
  }
  cargarLista();
