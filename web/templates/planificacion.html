<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>Planificación — Sistema de Fichaje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; font-size: .88rem; }
  header { background: #F1EFE8; border-bottom: 1px solid #D3D1C7; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  nav a { color: #2C2C2A; font-size: .9rem; text-decoration: none; opacity: .75; }
  nav a:hover { opacity: 1; }
  nav a.activo { opacity: 1; font-weight: bold; }
  .nav-group { position: relative; display: inline-flex; align-items: center; }
  .nav-trigger { color: #2C2C2A; font-size: .9rem; cursor: default; opacity: .75; user-select: none; white-space: nowrap; }
  .nav-group:hover .nav-trigger, .nav-group.activo .nav-trigger { opacity: 1; }
  .nav-group.activo .nav-trigger { font-weight: bold; }
  .nav-dropdown { display: none; position: absolute; top: 100%; left: 0;
    background: white; border: 1px solid #D3D1C7; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1); min-width: 160px; z-index: 200; padding: 4px 0; }
  .nav-group:hover .nav-dropdown { display: block; }
  .nav-dropdown a { display: block; padding: 8px 16px; }
  .nav-dropdown a:hover { background: #f4f6f9; }
  [data-perm] { display: none; }

  .toolbar { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nav-semana { display: flex; align-items: center; gap: 8px; }
  .nav-semana button { background: #2c3e50; border: none; color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: .9rem; }
  .nav-semana button:hover { background: #3d5166; }
  .nav-semana span { font-size: .9rem; font-weight: bold; min-width: 180px; text-align: center; }

  main { padding: 16px; overflow-x: auto; }

  .grilla-wrap { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; }

  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  thead th { padding: 10px 8px; text-align: center; font-size: .8rem; border-bottom: 2px solid #dee2e6; background: #f8f9fa; position: sticky; top: 0; z-index: 10; }
  thead th.col-nombre { text-align: left; padding-left: 12px; min-width: 180px; }
  thead th.hoy { background: #e8f4fd; color: #004085; }

  tbody tr:hover td { background: #fafafa; }
  tr.grupo-header td { background: #2c3e50; color: white; font-size: .75rem; font-weight: bold; text-transform: uppercase; letter-spacing: .05em; padding: 5px 12px; }

  td { padding: 3px 4px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  td.col-nombre { padding: 6px 12px; font-weight: bold; white-space: nowrap; }
  td.col-dia { text-align: center; }

  .celda {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 90px; padding: 4px 6px; border-radius: 4px;
    cursor: pointer; font-size: .75rem; font-weight: bold;
    border: 1px solid transparent; transition: filter .1s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;
  }
  .celda:hover { filter: brightness(.92); }
  .celda.vacia { background: #f8f9fa; color: #bbb; border: 1px dashed #ddd; font-weight: normal; }
  .celda.franco { background: #fff3cd; color: #856404; border-color: #ffc107; }
  .celda.simple { background: #d4edda; color: #155724; }
  .celda.cortado { background: #cce5ff; color: #004085; }
  .celda.hoy { box-shadow: 0 0 0 2px #007bff; }

  /* Modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; }
  .overlay.active { display: flex; align-items: center; justify-content: center; }
  .modal { background: white; border-radius: 10px; padding: 24px; width: 340px; }
  .modal h3 { font-size: 1rem; margin-bottom: 4px; }
  .modal .subtitulo { font-size: .8rem; color: #888; margin-bottom: 16px; }
  .opciones { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
  .opcion { padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: .85rem; border: 1px solid #dee2e6; }
  .opcion:hover { background: #f0f4f8; }
  .opcion.franco-opt { background: #fff3cd; border-color: #ffc107; color: #856404; }
  .opcion.vaciar-opt { color: #e74c3c; border-color: #e74c3c; }
  .opcion.simple { border-left: 4px solid #28a745; }
  .opcion.cortado { border-left: 4px solid #007bff; }
  .modal-footer { margin-top: 14px; text-align: right; }
  .btn-cancel { background: #eee; border: none; padding: 7px 16px; border-radius: 5px; cursor: pointer; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: #2c3e50; color: white; padding: 10px 18px; border-radius: 7px; display: none; z-index: 200; font-size: .85rem; }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/static/img/logo_horizontal_plano.svg" alt="SistemAlf" style="height:44px"></a>
  <nav style="display:flex;gap:16px;align-items:center">
    <div class="nav-group activo">
      <span class="nav-trigger">Programación ▾</span>
      <div class="nav-dropdown">
        <a href="/horarios">Horarios</a>
        <a href="/planificacion" class="activo">Planificación</a>
        <a href="/calendarios">Calendarios</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Registro ▾</span>
      <div class="nav-dropdown">
        <a href="/asistencia">Asistencia</a>
        <a href="/fichajes">Fichajes</a>
        <a href="/asistencia-mensual">Planilla</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Personal ▾</span>
      <div class="nav-dropdown">
        <a href="/empleados">Listado</a>
        <a href="/premios" data-perm="premios:ver">Premios</a>
        <a href="/vacaciones" data-perm="vacaciones:ver">Vacaciones</a>
      </div>
    </div>
    <a href="/configuracion" data-perm="usuarios:ver">Configuración</a>
    <span id="user-info" style="font-size:.78rem;color:#666;margin-left:8px"></span>
    <a href="#" onclick="logout()">Salir</a>
  </nav>
</header>

<div class="toolbar">
  <div class="nav-semana">
    <button onclick="cambiarSemana(-7)">&#8592;</button>
    <span id="label-semana">Cargando...</span>
    <button onclick="cambiarSemana(7)">&#8594;</button>
    <button onclick="irHoy()">Hoy</button>
    <button data-perm="calendarios:editar" onclick="generarSemana()" style="background:#27ae60" title="Pre-completar desde calendarios asignados">Generar desde calendarios</button>
  </div>
  <select id="filtro-turno" onchange="filtrarTabla()"
    style="padding:5px 10px;border-radius:4px;border:1px solid #ced4da;font-size:.85rem;outline:none;">
    <option value="">Todos los turnos</option>
  </select>
  <input id="filtro-nombre" type="search" placeholder="Buscar empleado..." oninput="filtrarTabla()"
    style="padding:5px 10px;border-radius:4px;border:1px solid #ced4da;font-size:.85rem;width:190px;outline:none">
</div>

<main>
  <div class="grilla-wrap">
    <table id="tabla-plan">
      <thead id="thead-plan"></thead>
      <tbody id="tbody-plan"></tbody>
    </table>
  </div>
</main>

<!-- Modal selección -->
<div class="overlay" id="overlay" onclick="cerrarModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-nombre"></h3>
    <div class="subtitulo" id="modal-fecha"></div>
    <div class="opciones" id="modal-opciones"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
function _localDateStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const DIAS_NOMBRES = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIAS_CORTOS  = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const hoy = _localDateStr();

let fechaRef = hoy;
let horarios = [];
let modalCtx = null;
let planData = {};        // clave: "empleadoId_fecha"
let horarioTurnoMap = {}; // horario_id → turno_id

async function logout() {
  await fetch('/api/auth/logout', {method:'POST'});
  location.href = '/login';
}

let _perms = new Set();
async function _loadPerms() {
  try {
    const me = await fetch('/api/auth/me').then(r => r.json());
    _perms = new Set((me.permisos || []).map(p => `${p.modulo}:${p.accion}`));
    if (me.nombre) document.getElementById('user-info').textContent = me.nombre;
  } catch(e) {}
  document.querySelectorAll('[data-perm]').forEach(el => {
    if (_perms.has(el.dataset.perm)) el.removeAttribute('data-perm');
  });
}
function canDo(m, a) { return _perms.has(`${m}:${a}`); }

function toast(msg, ms=2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", ms);
}

function lunes(fechaStr) {
  const d = new Date(fechaStr + "T12:00:00");
  const dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0,10);
}

function cambiarSemana(dias) {
  const d = new Date(fechaRef + "T12:00:00");
  d.setDate(d.getDate() + dias);
  fechaRef = d.toISOString().slice(0,10);
  cargar();
}

function irHoy() { fechaRef = hoy; cargar(); }

function formatFecha(iso) {
  const [y,m,d] = iso.split("-");
  return `${d}/${m}`;
}

function celda(plan, fecha, empleadoId, empleadoNombre) {
  const esHoy = fecha === hoy;
  let cls, txt;
  if (!plan) {
    cls = "vacia"; txt = "—";
  } else if (plan.es_franco) {
    cls = "franco"; txt = "FRANCO";
  } else {
    cls = plan.horario_tipo || "simple";
    txt = plan.horario_nombre || "?";
  }
  if (esHoy) cls += " hoy";
  const nombreEsc = empleadoNombre.replace(/'/g, "\\'");
  const clickAttr = canDo('planificacion','editar') ? `onclick="abrirModal(${empleadoId}, '${fecha}', '${nombreEsc}')"` : '';
  return `<span class="celda ${cls}" ${clickAttr} title="${txt}">${txt}</span>`;
}

async function cargar() {
  const res = await fetch(`/api/planificacion/semana?fecha=${fechaRef}`);
  const data = await res.json();
  horarios = data.horarios;

  // Mapa horario_id → turno_id para filtrado
  horarioTurnoMap = {};
  horarios.forEach(h => { horarioTurnoMap[h.id] = h.turno_id || null; });

  // Poblar selector de turnos (solo la primera carga)
  const sel = document.getElementById("filtro-turno");
  if (sel.options.length === 1) {
    const turnos = [...new Map(horarios.filter(h => h.turno_id).map(h => [h.turno_id, h])).values()];
    // Pedir la lista completa de turnos para tener nombre y orden correctos
    const tr = await fetch("/api/turnos").then(r => r.json());
    tr.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.nombre;
      sel.appendChild(opt);
    });
  }

  // Indexar plan por clave para el modal
  planData = {};
  for (const emp of data.empleados) {
    for (const [fecha, p] of Object.entries(emp.dias)) {
      if (p) planData[`${emp.empleado.id}_${fecha}`] = p;
    }
  }

  const lun = new Date(data.lunes + "T12:00:00");
  const dom = new Date(data.dias[6] + "T12:00:00");
  document.getElementById("label-semana").textContent =
    `${formatFecha(data.lunes)} al ${formatFecha(data.dias[6])}`;

  // Cabecera
  const thead = document.getElementById("thead-plan");
  thead.innerHTML = `<tr>
    <th class="col-nombre">Empleado</th>
    ${data.dias.map((d,i) => `
      <th class="${d === hoy ? 'hoy' : ''}">
        ${DIAS_CORTOS[i]}<br><small>${formatFecha(d)}</small>
      </th>`).join("")}
  </tr>`;

  // Cuerpo agrupado por cargo
  const tbody = document.getElementById("tbody-plan");
  let html = "";
  let cargoActual = null;

  for (const emp of data.empleados) {
    const cargo = emp.empleado.cargo || "Sin cargo asignado";
    if (cargo !== cargoActual) {
      html += `<tr class="grupo-header"><td colspan="8">${cargo}</td></tr>`;
      cargoActual = cargo;
    }
    const nombre = `${emp.empleado.apellido}${emp.empleado.nombre ? ", " + emp.empleado.nombre : ""}`;
    // Turnos que tiene este empleado esta semana
    const turnosEmp = data.dias.map(d => emp.dias[d]?.horario_id ? horarioTurnoMap[emp.dias[d].horario_id] : null).filter(Boolean);
    const dataTurnos = [...new Set(turnosEmp)].join(",");
    html += `<tr data-nombre="${nombre.toLowerCase()}" data-turnos="${dataTurnos}">
      <td class="col-nombre" title="${nombre}">${nombre}</td>
      ${data.dias.map(d => `<td class="col-dia">${celda(emp.dias[d], d, emp.empleado.id, nombre)}</td>`).join("")}
    </tr>`;
  }
  tbody.innerHTML = html;
  filtrarTabla();
}

function filtrarTabla() {
  const q = (document.getElementById("filtro-nombre").value || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const turnoFiltro = document.getElementById("filtro-turno").value;
  const filas = document.querySelectorAll("#tbody-plan tr");
  let grupoHeader = null;
  let grupoTieneVisible = false;

  filas.forEach(tr => {
    if (tr.classList.contains("grupo-header")) {
      if (grupoHeader) grupoHeader.style.display = grupoTieneVisible ? "" : "none";
      grupoHeader = tr;
      grupoTieneVisible = false;
    } else {
      const nombre = (tr.dataset.nombre || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
      const turnos = (tr.dataset.turnos || "").split(",").filter(Boolean);
      const matchNombre = !q || nombre.includes(q);
      const matchTurno = !turnoFiltro || turnos.includes(turnoFiltro);
      const visible = matchNombre && matchTurno;
      tr.style.display = visible ? "" : "none";
      if (visible) grupoTieneVisible = true;
    }
  });
  if (grupoHeader) grupoHeader.style.display = grupoTieneVisible ? "" : "none";
}

function abrirModal(empleadoId, fecha, nombre) {
  const plan = planData[`${empleadoId}_${fecha}`] || null;
  modalCtx = { empleadoId, fecha };

  document.getElementById("modal-nombre").textContent = nombre;
  const [y,m,d] = fecha.split("-");
  const diaIdx = new Date(fecha + "T12:00:00").getDay();
  const diaNombre = DIAS_NOMBRES[diaIdx === 0 ? 6 : diaIdx - 1];
  document.getElementById("modal-fecha").textContent = `${diaNombre} ${d}/${m}/${y}`;

  const cont = document.getElementById("modal-opciones");
  let html = "";

  // Franco
  const francoActivo = plan && plan.es_franco ? " ✓" : "";
  html += `<div class="opcion franco-opt" onclick="asignar(${empleadoId}, '${fecha}', null, true)">FRANCO${francoActivo}</div>`;

  // Horarios
  for (const h of horarios) {
    const activo = plan && !plan.es_franco && plan.horario_id === h.id ? " ✓" : "";
    html += `<div class="opcion ${h.tipo}" onclick="asignar(${empleadoId}, '${fecha}', ${h.id}, false)">${h.nombre}${activo}</div>`;
  }

  // Limpiar
  if (plan) {
    html += `<div class="opcion vaciar-opt" onclick="asignar(${empleadoId}, '${fecha}', null, false)">Quitar asignación</div>`;
  }

  cont.innerHTML = html;
  document.getElementById("overlay").classList.add("active");
}

function cerrarModal(e) {
  if (e && e.target !== document.getElementById("overlay")) return;
  document.getElementById("overlay").classList.remove("active");
}

async function asignar(empleadoId, fecha, horarioId, esFranco) {
  document.getElementById("overlay").classList.remove("active");
  const res = await fetch("/api/planificacion", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ empleado_id: empleadoId, fecha, horario_id: horarioId, es_franco: esFranco }),
  });
  if (res.ok) {
    const data = await res.json();
    const msg = data.accion === "eliminado" ? "Asignación eliminada" :
                esFranco ? "Franco asignado" : "Horario asignado";
    toast(msg);
    cargar();
  } else {
    toast("Error al guardar");
  }
}

async function generarSemana() {
  const res = await fetch(`/api/calendarios/generar-semana?fecha=${fechaRef}`, {
    method: "POST"
  });
  if (res.ok) {
    const r = await res.json();
    toast(`Generado: ${r.generados} celdas nuevas, ${r.omitidos} ya existían`);
    cargar();
  } else {
    toast("Error al generar semana");
  }
}

_loadPerms().then(() => {
  cargar().then(() => {
    const emp = new URLSearchParams(location.search).get('empleado');
    if (emp) {
      document.getElementById('filtro-nombre').value = emp;
      filtrarTabla();
    }
  });
});
</script>
</body>
</html>
