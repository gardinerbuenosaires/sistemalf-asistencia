<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>Fichajes — Sistema de Fichaje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
  header { background: #F1EFE8; border-bottom: 1px solid #D3D1C7; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  main { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .card h3 { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
  .card .value { font-size: 1rem; font-weight: bold; margin-top: 4px; }
  .section { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 24px; }
  .section h2 { font-size: 1rem; margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th { text-align: left; padding: 8px; background: #f8f9fa; border-bottom: 2px solid #dee2e6; }
  td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
  .badge.entrada { background: #d4edda; color: #155724; }
  .badge.salida { background: #cce5ff; color: #004085; }
  .badge.sin-tipo { background: #fff3cd; color: #856404; }
  .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  .btn-primary { background: #2c3e50; color: white; }
  .btn-primary:hover { background: #3d5166; }
  .btn-sync { background: #27ae60; color: white; margin-left: 8px; }
  .btn-sync:hover { background: #219a52; }
  .filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
  .filters label { font-size: 0.85rem; color: #666; }
  .filters input, .filters select { display: block; padding: 6px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.9rem; margin-top: 4px; }
  #toast { position: fixed; bottom: 24px; right: 24px; background: #2c3e50; color: white; padding: 12px 20px; border-radius: 8px; display: none; z-index: 100; }
  nav a { color: #2C2C2A; font-size: .9rem; text-decoration: none; opacity: .75; }
  nav a:hover { opacity: 1; }
  nav a.activo { opacity: 1; font-weight: bold; }
  .nav-group { position: relative; display: inline-flex; align-items: center; }
  .nav-trigger { color: #2C2C2A; font-size: .9rem; cursor: default; opacity: .75; user-select: none; white-space: nowrap; }
  .nav-group:hover .nav-trigger, .nav-group.activo .nav-trigger { opacity: 1; }
  .nav-group.activo .nav-trigger { font-weight: bold; }
  .nav-dropdown { display: none; position: absolute; top: 100%; left: 0;
    background: white; border: 1px solid #D3D1C7; border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1); min-width: 160px; z-index: 200; padding: 4px 0; }
  .nav-group:hover .nav-dropdown { display: block; }
  .nav-dropdown a { display: block; padding: 8px 16px; margin-left: 0; }
  .nav-dropdown a:hover { background: #f4f6f9; }
  [data-perm] { display: none; }
</style>
</head>
<body>

<header>
  <a href="/"><img src="/static/img/logo_horizontal_plano.svg" alt="SistemAlf Check" style="height:44px"></a>
  <nav style="display:flex;gap:16px;align-items:center">
    <div class="nav-group">
      <span class="nav-trigger">Programación ▾</span>
      <div class="nav-dropdown">
        <a href="/horarios">Horarios</a>
        <a href="/planificacion">Planificación</a>
        <a href="/calendarios">Calendarios</a>
      </div>
    </div>
    <div class="nav-group activo">
      <span class="nav-trigger">Registro ▾</span>
      <div class="nav-dropdown">
        <a href="/asistencia">Asistencia</a>
        <a href="/fichajes" class="activo">Fichajes</a>
        <a href="/asistencia-mensual">Planilla</a>
      </div>
    </div>
    <div class="nav-group">
      <span class="nav-trigger">Personal ▾</span>
      <div class="nav-dropdown">
        <a href="/empleados">Listado</a>
        <a href="/premios" data-perm="premios:ver">Premios</a>
        <a href="/vacaciones" data-perm="vacaciones:ver">Vacaciones</a>
      </div>
    </div>
    <a href="/configuracion" data-perm="usuarios:ver">Configuración</a>
    <span id="user-info" style="font-size:.78rem;color:#666;margin-left:8px"></span>
    <a href="#" onclick="logout()">Salir</a>
  </nav>
</header>

<main>

  <div class="cards">
    <div class="card">
      <h3>Última sincronización</h3>
      <div class="value" id="ultima-sync">—</div>
    </div>
    <div class="card">
      <h3>Resultado</h3>
      <div class="value" id="sync-resultado" style="font-size:.85rem;color:#666">—</div>
    </div>
  </div>

  <div class="section">
    <h2>Fichajes</h2>
    <div class="filters">
      <div>
        <label>Empleado</label>
        <select id="filter-empleado"><option value="">Todos</option></select>
      </div>
      <div>
        <label>Desde</label>
        <input type="date" id="filter-desde">
      </div>
      <div>
        <label>Hasta</label>
        <input type="date" id="filter-hasta">
      </div>
      <div style="align-self:flex-end">
        <button class="btn btn-primary" onclick="loadFichajes()">Filtrar</button>
        <button class="btn btn-primary btn-sync" onclick="syncNow()">Sincronizar ahora</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>Nombre</th><th>Fecha / Hora</th><th>Tipo</th></tr>
      </thead>
      <tbody id="tabla-fichajes"><tr><td colspan="4">Cargando...</td></tr></tbody>
    </table>
  </div>

</main>

<div id="toast"></div>

<script>
let _perms = new Set();
async function _loadPerms() {
  try {
    const me = await fetch('/api/auth/me').then(r => r.json());
    _perms = new Set((me.permisos || []).map(p => `${p.modulo}:${p.accion}`));
  } catch(e) {}
  document.querySelectorAll('[data-perm]').forEach(el => {
    if (_perms.has(el.dataset.perm)) el.removeAttribute('data-perm');
  });
}
function canDo(m, a) { return _perms.has(`${m}:${a}`); }

const today = new Date().toISOString().slice(0, 10);

async function logout() {
  await fetch("/api/auth/logout", { method: "POST" });
  window.location.href = "/login";
}

fetch("/api/auth/me").then(r => r.ok ? r.json() : null).then(u => {
  if (u) document.getElementById("user-info").textContent = u.nombre;
});

async function api(path) {
  const r = await fetch(path);
  return r.json();
}

function badge(tipo) {
  if (!tipo) return '<span class="badge sin-tipo">?</span>';
  return `<span class="badge ${tipo}">${tipo}</span>`;
}

function toast(msg, ms = 3000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", ms);
}

async function loadEmpleados() {
  const empleados = await api("/api/empleados");
  const sel = document.getElementById("filter-empleado");
  empleados.forEach(e => {
    const opt = document.createElement("option");
    opt.value = e.user_id;
    opt.textContent = `${e.apellido}${e.nombre ? ', ' + e.nombre : ''} (${e.user_id})`;
    sel.appendChild(opt);
  });
}

async function loadFichajes() {
  const uid   = document.getElementById("filter-empleado").value;
  const desde = document.getElementById("filter-desde").value;
  const hasta = document.getElementById("filter-hasta").value;
  let url = `/api/fichajes?limit=500`;
  if (uid)   url += `&user_id=${uid}`;
  if (desde) url += `&fecha_desde=${desde}`;
  if (hasta) url += `&fecha_hasta=${hasta}`;

  const [fichajes, empleados] = await Promise.all([api(url), api("/api/empleados")]);
  const empMap = Object.fromEntries(empleados.map(e => [e.user_id, `${e.apellido}${e.nombre ? ', ' + e.nombre : ''}`]));

  const tbody = document.getElementById("tabla-fichajes");
  if (!fichajes.length) {
    tbody.innerHTML = "<tr><td colspan='4'>Sin registros</td></tr>";
    return;
  }
  tbody.innerHTML = fichajes.map(f => `
    <tr>
      <td>${f.user_id}</td>
      <td>${empMap[f.user_id] || "—"}</td>
      <td>${f.timestamp}</td>
      <td>${badge(f.tipo)}</td>
    </tr>
  `).join("");
}

async function loadSyncLog() {
  const logs = await api("/api/sync/log?limit=1");
  if (logs.length) {
    const l = logs[0];
    document.getElementById("ultima-sync").textContent = l.finalizado_en || l.iniciado_en;
    document.getElementById("sync-resultado").textContent =
      l.error ? `Error: ${l.error}` : `${l.registros_nuevos} nuevos de ${l.registros_leidos} leídos`;
  }
}

async function syncNow() {
  toast("Sincronizando con el dispositivo...", 60000);
  try {
    const r = await api("/api/sync/now");
    toast(`Sync OK: ${r.nuevos} nuevos de ${r.leidos} registros`);
    loadFichajes();
    loadSyncLog();
  } catch (e) {
    toast("Error al sincronizar: " + e.message);
  }
}

document.getElementById("filter-desde").value = today;
document.getElementById("filter-hasta").value = today;
_loadPerms().then(() => {
  loadEmpleados();
  loadFichajes();
  loadSyncLog();
});
</script>
</body>
</html>
