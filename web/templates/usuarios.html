<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<title>Usuarios — Sistema de Fichaje</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
  header { background: #2c3e50; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header a { color: rgba(255,255,255,.7); text-decoration: none; font-size: .9rem; }
  header a:hover { color: white; }
  header h1 { font-size: 1.1rem; flex: 1; }

  main { padding: 20px; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }

  .panel { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #eee; }
  .panel-header h2 { font-size: .95rem; }

  .usr-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
  .usr-item:hover { background: #f8f9fa; }
  .usr-item.activo { background: #eef2f5; border-left: 3px solid #2c3e50; }
  .usr-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: bold; color: white; flex-shrink: 0; }
  .usr-nombre { font-weight: bold; font-size: .88rem; }
  .usr-email { font-size: .75rem; color: #888; }

  .rol-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: bold; }

  .form-scroll { padding: 20px; }
  .form-group { margin-bottom: 14px; }
  label { font-size: .78rem; color: #666; font-weight: bold; display: block; margin-bottom: 3px; }
  input[type=text], input[type=email], input[type=password], select {
    width: 100%; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: .88rem;
  }
  input:focus, select:focus { outline: none; border-color: #2c3e50; }
  .hint { font-size: .72rem; color: #aaa; margin-top: 3px; }

  .form-footer { display: flex; gap: 8px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #eee; margin-top: 4px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: .85rem; font-weight: bold; }
  .btn-primary   { background: #2c3e50; color: white; }
  .btn-primary:hover { background: #3d5166; }
  .btn-secondary { background: #eee; color: #555; }
  .btn-danger    { background: #e74c3c; color: white; }
  .btn-sm { padding: 4px 12px; font-size: .78rem; font-weight: normal; }

  .clave-section { border-top: 1px dashed #eee; margin-top: 16px; padding-top: 14px; }
  .clave-section h3 { font-size: .82rem; color: #888; margin-bottom: 10px; }

  .empty { padding: 20px; text-align: center; color: #aaa; font-size: .88rem; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #2c3e50; color: white; padding: 10px 18px; border-radius: 7px; display: none; z-index: 200; font-size: .88rem; }

  .me-badge { font-size: .7rem; background: #e2e3e5; color: #555; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
</style>
</head>
<body>
<header>
  <a href="/" title="Inicio" style="display:flex;align-items:center"><img src="/static/img/logo_icono.svg" alt="Inicio" style="height:28px"></a>
  <h1>Gestión de usuarios</h1>
  <a href="/roles">Gestión de roles</a>
</header>

<main>
  <!-- Lista -->
  <div class="panel">
    <div class="panel-header">
      <h2>Usuarios (<span id="cnt">0</span>)</h2>
      <button class="btn btn-primary btn-sm" onclick="nuevoUsuario()">+ Nuevo</button>
    </div>
    <div id="usr-list"><div class="empty">Cargando...</div></div>
  </div>

  <!-- Formulario -->
  <div class="panel">
    <div class="panel-header">
      <h2 id="form-titulo">Seleccioná un usuario</h2>
    </div>
    <div class="form-scroll" id="form-contenido">
      <div class="empty">Seleccioná un usuario o creá uno nuevo.</div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
let usuarios = [];
let rolesList = [];
let editandoId = null;
let meId = null;

function toast(msg, ms=2500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => el.style.display="none", ms);
}

const _PALETTE = ["#2c3e50","#2980b9","#8e44ad","#f39c12","#e74c3c","#27ae60","#16a085","#c0392b"];
function colorRol(nombre) {
  let h = 0; for (const c of (nombre||"")) h = (h*31 + c.charCodeAt(0)) & 0xFFFF;
  return _PALETTE[h % _PALETTE.length];
}

function rolBadge(rid) {
  const r = rolesList.find(x => x.id === rid);
  if (!r) return '';
  const c = colorRol(r.nombre);
  return `<span class="rol-badge" style="background:${c}22;color:${c}">${r.nombre}</span>`;
}

function iniciales(nombre) {
  return nombre.split(" ").slice(0,2).map(p=>p[0]||"").join("").toUpperCase();
}

async function cargar() {
  const [uRes, rRes, meRes] = await Promise.all([
    fetch("/api/usuarios"), fetch("/api/roles"), fetch("/api/auth/me")
  ]);
  usuarios = await uRes.json();
  rolesList = await rRes.json();
  const me = await meRes.json();
  meId = me.id;

  document.getElementById("cnt").textContent = usuarios.length;
  document.getElementById("usr-list").innerHTML = usuarios.map(u => {
    const c = colorRol(rolesList.find(r => r.id === u.rol_id)?.nombre || "");
    return `
    <div class="usr-item${u.id===editandoId?" activo":""}" id="usr-${u.id}" onclick="editarUsuario(${u.id})">
      <div class="usr-avatar" style="background:${c||'#aaa'}">${iniciales(u.nombre)}</div>
      <div style="flex:1;min-width:0">
        <div class="usr-nombre">${u.nombre}${u.id===meId?'<span class="me-badge">yo</span>':""} ${!u.activo?'<span class="me-badge">inactivo</span>':""}</div>
        <div class="usr-email">${u.email}</div>
      </div>
      ${rolBadge(u.rol_id)}
    </div>`;
  }).join("");
}

function nuevoUsuario() {
  editandoId = null;
  document.getElementById("form-titulo").textContent = "Nuevo usuario";
  document.getElementById("form-contenido").innerHTML = buildForm();
  document.querySelectorAll(".usr-item").forEach(el=>el.classList.remove("activo"));
}

async function editarUsuario(id) {
  editandoId = id;
  const u = usuarios.find(x=>x.id===id);
  document.getElementById("form-titulo").textContent = u.nombre;
  document.getElementById("form-contenido").innerHTML = buildForm(u);
  document.querySelectorAll(".usr-item").forEach(el=>el.classList.remove("activo"));
  document.getElementById(`usr-${id}`)?.classList.add("activo");
}

function buildForm(u={}) {
  const optsRoles = rolesList.map(r =>
    `<option value="${r.id}"${u.rol_id===r.id?" selected":""}>${r.nombre}</option>`
  ).join("");
  const rolActual = rolesList.find(r => r.id === u.rol_id);
  return `
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="f-nombre" value="${u.nombre||""}">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="f-email" value="${u.email||""}">
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="f-rol" onchange="updatePermisoHint()">
        <option value="">— Seleccioná un rol —</option>
        ${optsRoles}
      </select>
      <div class="hint" id="permiso-hint">${rolActual?.descripcion||""}</div>
    </div>
    ${u.id ? `
    <div class="form-group">
      <label>Estado</label>
      <select id="f-activo">
        <option value="1"${u.activo?" selected":""}>Activo</option>
        <option value="0"${!u.activo?" selected":""}>Inactivo</option>
      </select>
    </div>` : `
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="f-password" placeholder="Mínimo 6 caracteres">
    </div>`}
    ${u.id ? `
    <div class="clave-section">
      <h3>Cambiar contraseña (opcional)</h3>
      <div class="form-group">
        <input type="password" id="f-password" placeholder="Nueva contraseña (dejar vacío para no cambiar)">
        <div class="hint">Mínimo 6 caracteres si cambiás</div>
      </div>
    </div>` : ""}
    <div class="form-footer">
      ${u.id && u.id!==meId ? `<button class="btn btn-danger btn-sm" onclick="eliminar(${u.id})">Eliminar</button>` : ""}
      <button class="btn btn-secondary" onclick="cancelar()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>`;
}

function updatePermisoHint() {
  const rid = parseInt(document.getElementById("f-rol")?.value);
  const el  = document.getElementById("permiso-hint");
  if (el) el.textContent = rolesList.find(r => r.id === rid)?.descripcion || "";
}

function cancelar() {
  editandoId = null;
  document.getElementById("form-titulo").textContent = "Seleccioná un usuario";
  document.getElementById("form-contenido").innerHTML = '<div class="empty">Seleccioná un usuario o creá uno nuevo.</div>';
  document.querySelectorAll(".usr-item").forEach(el=>el.classList.remove("activo"));
}

async function guardar() {
  const nombre   = document.getElementById("f-nombre")?.value.trim();
  const email    = document.getElementById("f-email")?.value.trim();
  const rol_id   = parseInt(document.getElementById("f-rol")?.value) || null;
  const password = document.getElementById("f-password")?.value || "";
  const activo   = parseInt(document.getElementById("f-activo")?.value ?? "1");

  if (!nombre || !email || !rol_id) { toast("Completá todos los campos"); return; }

  const url    = editandoId ? `/api/usuarios/${editandoId}` : "/api/usuarios";
  const method = editandoId ? "PUT" : "POST";
  const body   = editandoId
    ? { nombre, email, rol_id, activo, password }
    : { nombre, email, rol_id, password };

  const res = await fetch(url, { method, headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if (res.ok) {
    toast(editandoId ? "Usuario actualizado" : "Usuario creado");
    await cargar();
    if (editandoId) document.getElementById(`usr-${editandoId}`)?.classList.add("activo");
  } else {
    const e = await res.json().catch(()=>({}));
    toast("Error: " + (e.detail||"desconocido"));
  }
}

async function eliminar(id) {
  const u = usuarios.find(x=>x.id===id);
  if (!confirm(`¿Eliminar el usuario "${u?.nombre}"? Esta acción no se puede deshacer.`)) return;
  const res = await fetch(`/api/usuarios/${id}`, { method:"DELETE" });
  if (res.ok) { toast("Usuario eliminado"); cancelar(); await cargar(); }
  else { const e=await res.json().catch(()=>({})); toast("Error: "+(e.detail||"desconocido")); }
}

cargar();
</script>
</body>
</html>
